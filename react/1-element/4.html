<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Element Example-1</title>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>

    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <script>
      // function createElement(type, props, ...children) {
      //   return {
      //     $$typeof: Symbol.for("react.element"),
      //     type,
      //     ref: null,
      //     props: { ...props, children },
      //   };
      // }

      // Use React.createElement instead of function createElement

      const vdom = React.createElement(
        "ul", { className: "task-list" },
        React.createElement("li", { className: "task-item" }, "Dating with my wife"),
        React.createElement("li", { className: "task-item" }, "Feed cat and dog"),
      );

      const reactRoot = ReactDOM.createRoot(document.getElementById("root"));
      reactRoot.render(vdom);
    </script>
  </body>
</html>
