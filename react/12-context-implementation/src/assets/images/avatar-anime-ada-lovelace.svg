<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Anime-style Ada Lovelace avatar: Victorian hair bun, big anime eyes, ribbon collar -->
  <defs>
    <clipPath id="avatar-circle">
      <circle cx="64" cy="64" r="60" />
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#avatar-circle)">
    <rect width="128" height="128" fill="#f5e6d3" />

    <!-- Hair back + shoulders -->
    <path d="M32 128 C30 96 36 78 44 70 L84 70 C92 78 98 96 96 128 Z" fill="#4a3222" />
    <path d="M36 128 C36 100 42 86 48 80 L80 80 C86 86 92 100 92 128 Z" fill="#fff" />
    <path d="M56 84 L64 94 L72 84 L72 80 L56 80 Z" fill="#c96f6f" />

    <!-- Hair bun -->
    <circle cx="64" cy="20" r="12" fill="#4a3222" />
    <circle cx="64" cy="20" r="12" fill="none" stroke="#3a2718" stroke-width="2" />
    <path d="M56 16 C58 12 70 12 72 16" fill="none" stroke="#5d4430" stroke-width="3" stroke-linecap="round" />

    <!-- Hair front / bangs -->
    <path d="M38 56 C36 34 48 24 64 24 C80 24 92 34 90 56 C90 62 88 66 86 68 C86 56 82 48 78 44 C74 50 64 52 58 46 C54 50 46 50 42 44 C40 48 38 56 40 66 C38 64 38 60 38 56 Z" fill="#4a3222" />
    <path d="M40 60 C38 44 46 28 64 26 C80 28 88 44 86 60 C84 46 78 40 74 38 C70 44 60 46 56 40 C50 42 44 44 42 52 C41 55 40 58 40 60 Z" fill="#5d4430" />

    <!-- Side locks -->
    <path d="M38 56 C36 66 36 76 40 82 C42 74 42 64 42 58 Z" fill="#4a3222" />
    <path d="M90 56 C92 66 92 76 88 82 C86 74 86 64 86 58 Z" fill="#4a3222" />

    <!-- Face -->
    <ellipse cx="64" cy="64" rx="24" ry="26" fill="#ffe8d6" />

    <!-- Ears -->
    <ellipse cx="40" cy="66" rx="3.5" ry="5" fill="#ffe8d6" />
    <ellipse cx="88" cy="66" rx="3.5" ry="5" fill="#ffe8d6" />

    <!-- Eyes (big anime style) -->
    <g>
      <!-- Left eye -->
      <ellipse cx="52" cy="66" rx="6" ry="8" fill="#fff" />
      <ellipse cx="52" cy="66" rx="5" ry="7" fill="#3a6ea5" />
      <ellipse cx="52" cy="68" rx="4.5" ry="5.5" fill="#1e3f66" />
      <circle cx="54" cy="63" r="2" fill="#fff" />
      <circle cx="50" cy="70" r="1.2" fill="#a8c8ee" />
      <path d="M45 60 C48 57 56 57 59 60" fill="none" stroke="#3a2718" stroke-width="2.5" stroke-linecap="round" />
      <!-- Right eye -->
      <ellipse cx="76" cy="66" rx="6" ry="8" fill="#fff" />
      <ellipse cx="76" cy="66" rx="5" ry="7" fill="#3a6ea5" />
      <ellipse cx="76" cy="68" rx="4.5" ry="5.5" fill="#1e3f66" />
      <circle cx="78" cy="63" r="2" fill="#fff" />
      <circle cx="74" cy="70" r="1.2" fill="#a8c8ee" />
      <path d="M69 60 C72 57 80 57 83 60" fill="none" stroke="#3a2718" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Eyebrows -->
    <path d="M46 53 C50 51 55 51 58 53" fill="none" stroke="#3a2718" stroke-width="1.5" stroke-linecap="round" />
    <path d="M70 53 C73 51 78 51 82 53" fill="none" stroke="#3a2718" stroke-width="1.5" stroke-linecap="round" />

    <!-- Blush -->
    <ellipse cx="47" cy="75" rx="4" ry="2.5" fill="#ffb3a7" opacity="0.55" />
    <ellipse cx="81" cy="75" rx="4" ry="2.5" fill="#ffb3a7" opacity="0.55" />

    <!-- Nose + smile -->
    <path d="M63 72 L64 74 L66 72" fill="none" stroke="#e8a88c" stroke-width="1.5" stroke-linecap="round" />
    <path d="M59 79 C62 82 66 82 69 79" fill="none" stroke="#c96f6f" stroke-width="2" stroke-linecap="round" />

    <!-- Bun ribbon (Ada accent) -->
    <path d="M70 14 L78 8 L78 18 Z" fill="#c96f6f" />
    <path d="M70 14 L62 8 L62 18 Z" fill="#e08e8e" />
    <circle cx="70" cy="14" r="2.5" fill="#a34f4f" />

    <!-- Collar ribbon -->
    <path d="M64 94 L56 90 L56 98 Z" fill="#c96f6f" />
    <path d="M64 94 L72 90 L72 98 Z" fill="#e08e8e" />
    <circle cx="64" cy="94" r="2.5" fill="#a34f4f" />
  </g>

  <!-- Avatar ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#4a3222" stroke-width="4" />
</svg>
