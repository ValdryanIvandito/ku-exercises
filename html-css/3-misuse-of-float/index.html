<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misuse of Float</title>
    <style>
      .container {
        background-color: whitesmoke;
      }

      .rectangle {
        width: 100px;
        height: 100px;
        background: skyblue;
        margin-bottom: 30px;
        margin-right: 30px;
        float: right;
        font-size: 90px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="rectangle">1</div>
      <div class="rectangle">2</div>
      <div class="rectangle">3</div>
      <p style="background: red;">A</p>

      <!-- Note: Always use "clear: both" to solve the issue of misuse of float side effect.
      if you don't use "clear" the container element doesn't appear.  -->
      <div style="clear: both"></div>
    </div>
  </body>
</html>
